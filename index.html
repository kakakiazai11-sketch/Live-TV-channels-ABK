<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Live TV Box</title>
    <!-- HLS.js for playing .m3u8 streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #00bcd4; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; margin: auto; }
        .sidebar { flex: 1; min-width: 250px; background: #1e1e1e; padding: 15px; border-radius: 8px; max-height: 500px; overflow-y: auto; }
        .player-area { flex: 3; min-width: 300px; background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: center; }
        video { width: 100%; max-height: 450px; background: #000; border-radius: 6px; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; margin-bottom: 8px; background: #2c2c2c; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        li:hover { background: #00bcd4; color: #000; }
    </style>
</head>
<body>

    <h1>Mera Live TV Box</h1>
    
    <div class="container">
        <!-- چینلز کی لسٹ -->
        <div class="sidebar">
            <h3>Channels List</h3>
            <ul id="channel-list">
                <!-- یہاں آپ اپنے پسندیدہ چینلز کے HLS (.m3u8) لنکس ڈالیں گے -->
                <li onclick="playChannel('YOUR_CHANNEL_LINK_1.m3u8', 'Channel 1')">Channel 1 (Sports/News)</li>
                <li onclick="playChannel('YOUR_CHANNEL_LINK_2.m3u8', 'Channel 2')">Channel 2 (Cartoon/Kids)</li>
                <li onclick="playChannel('YOUR_CHANNEL_LINK_3.m3u8', 'Channel 3')">Channel 3 (Islamic)</li>
            </ul>
        </div>

        <!-- ویڈیو اسکرین -->
        <div class="player-area">
            <h3 id="current-title">Select a Channel</h3>
            <video id="video" controls autoplay></video>
        </div>
    </div>

    <script>
        function playChannel(url, name) {
            document.getElementById('current-title').innerText = "Playing: " + name;
            var video = document.getElementById('video');
            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }
    </script>
</body>
</html>
